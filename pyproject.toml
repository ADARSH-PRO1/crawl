[project]
name = "askg1-crawler"
version = "0.1.0"
description = "askg1-only site crawler (Crawl4AI) with optional Browser Use agent and Streamlit UI"
requires-python = ">=3.11"
dependencies = [
    "crawl4ai==0.9.5",
    "browser-use==0.13.11",
    "streamlit>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
